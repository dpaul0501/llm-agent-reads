<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #1f2937; }
      .label { font: 700 22px Arial, sans-serif; fill: #1f2937; }
      .small { font: 500 18px Arial, sans-serif; fill: #475569; }
      .token { fill: #edf6ff; stroke: #4ea8de; stroke-width: 2; }
      .encoder { fill: #eefcf5; stroke: #46b483; stroke-width: 2; }
      .decoder { fill: #fff4e6; stroke: #f2a65a; stroke-width: 2; }
      .logits { fill: #f5f0ff; stroke: #8f6ad7; stroke-width: 2; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 8 8; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <text x="600" y="58" text-anchor="middle" class="title">Transformer sentence flow: encoder + decoder</text>

  <rect x="50" y="160" width="170" height="340" rx="18" class="token"/>
  <text x="135" y="210" text-anchor="middle" class="label">Input sentence</text>
  <g font-size="26" font-weight="700" fill="#1f2937" text-anchor="middle">
    <rect x="78" y="245" width="114" height="40" rx="10" fill="#dfeeff" stroke="#4ea8de"/>
    <text x="135" y="272">the</text>
    <rect x="78" y="300" width="114" height="40" rx="10" fill="#dfeeff" stroke="#4ea8de"/>
    <text x="135" y="327">cat</text>
    <rect x="78" y="355" width="114" height="40" rx="10" fill="#dfeeff" stroke="#4ea8de"/>
    <text x="135" y="382">sat</text>
    <rect x="78" y="410" width="114" height="40" rx="10" fill="#dfeeff" stroke="#4ea8de"/>
    <text x="135" y="437">on</text>
  </g>

  <path d="M220 330 H 290" class="arrow"/>

  <rect x="290" y="130" width="260" height="400" rx="20" class="encoder"/>
  <text x="420" y="175" text-anchor="middle" class="label">Encoder stack</text>
  <text x="420" y="235" text-anchor="middle" class="small">Embedding + positional encoding</text>
  <text x="420" y="285" text-anchor="middle" class="small">Self-attention</text>
  <text x="420" y="335" text-anchor="middle" class="small">Residual + layer norm</text>
  <text x="420" y="385" text-anchor="middle" class="small">Feed-forward network</text>
  <text x="420" y="435" text-anchor="middle" class="small">Contextualized states</text>

  <path d="M550 330 H 620" class="arrow"/>

  <rect x="620" y="130" width="260" height="400" rx="20" class="decoder"/>
  <text x="750" y="175" text-anchor="middle" class="label">Decoder stack</text>
  <text x="750" y="235" text-anchor="middle" class="small">Causal attention</text>
  <text x="750" y="285" text-anchor="middle" class="small">Cross-attention to encoder output</text>
  <text x="750" y="335" text-anchor="middle" class="small">Residual + layer norm</text>
  <text x="750" y="385" text-anchor="middle" class="small">Generate next token</text>
  <text x="750" y="435" text-anchor="middle" class="small">e.g. “on”</text>

  <path d="M880 330 H 960" class="arrow"/>

  <rect x="960" y="205" width="170" height="250" rx="18" class="logits"/>
  <text x="1045" y="255" text-anchor="middle" class="label">Output</text>
  <text x="1045" y="300" text-anchor="middle" class="small">logits</text>
  <text x="1045" y="340" text-anchor="middle" class="small">softmax</text>
  <text x="1045" y="380" text-anchor="middle" class="small">next-token dist.</text>

  <path d="M420 520 L 420 560" class="dashed"/>
  <path d="M750 520 L 750 560" class="dashed"/>
  <text x="420" y="585" text-anchor="middle" class="small">encoder reads the full sentence</text>
  <text x="750" y="585" text-anchor="middle" class="small">decoder generates the continuation</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 220" role="img" aria-labelledby="title desc">
  <title id="title">Representation pipeline from text to prediction</title>
  <desc id="desc">Text passes through tokenization, encoding, numeric representation, and a language model to produce a next-token prediction.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#5b5f97"/>
    </marker>
    <style>
      .box { fill: #f5f3ff; stroke: #5b5f97; stroke-width: 3; }
      .text { fill: #202338; font: 600 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .small { font-size: 19px; }
      .edge { fill: none; stroke: #5b5f97; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box" x="15" y="65" width="165" height="90" rx="15"/>
  <text class="text" x="97.5" y="104"><tspan x="97.5">Text</tspan><tspan class="small" x="97.5" dy="30">the cat sat</tspan></text>

  <path class="edge" d="M180 110 H218"/>
  <rect class="box" x="225" y="65" width="170" height="90" rx="15"/>
  <text class="text" x="310" y="117">Tokenization</text>

  <path class="edge" d="M395 110 H433"/>
  <rect class="box" x="440" y="65" width="150" height="90" rx="15"/>
  <text class="text" x="515" y="117">Encoding</text>

  <path class="edge" d="M590 110 H628"/>
  <rect class="box" x="635" y="65" width="205" height="90" rx="15"/>
  <text class="text small" x="737.5" y="104"><tspan x="737.5">Numeric</tspan><tspan x="737.5" dy="28">representation</tspan></text>

  <path class="edge" d="M840 110 H878"/>
  <rect class="box" x="885" y="65" width="165" height="90" rx="15"/>
  <text class="text small" x="967.5" y="104"><tspan x="967.5">Language</tspan><tspan x="967.5" dy="28">model</tspan></text>

  <path class="edge" d="M1050 110 H1088"/>
  <rect class="box" x="1095" y="65" width="240" height="90" rx="15"/>
  <text class="text small" x="1215" y="104"><tspan x="1215">Next-token</tspan><tspan x="1215" dy="28">prediction</tspan></text>
</svg>
